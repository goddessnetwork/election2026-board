function rng(seed){let x=seed*9301+49297;return()=>((x=(x*9301+49297)%233280)/233280)}
function fxHTML(cf,el){const R=rng(CARDS.indexOf(cf)+7),gold=["#FFE9A8","#F2D27A","#D9BE7C","#FFF6D6","#C9A65A","#FFFFFF"];let p="";

function sealSVG(u,by,t){let pts="";for(let i=0;i<72;i++){const a=i/72*Math.PI*2,r=i%2?92.5:99;pts+=(100+r*Math.cos(a)).toFixed(1)+","+(100+r*Math.sin(a)).toFixed(1)+" "}

function dustHTML(seed,sz){const R=rng(seed+11),c=["#FFF3C4","#F2D27A","#D9BE7C","#B8954A","#8A6320","#FFFFFF"];let s="";
 for(let i=0;i<26;i++){const a=R()*Math.PI*2,r0=sz*(.42+R()*.06),d=sz*(.3+R()*.6),z=4+(R()*7|0);
  s+=`<u style="left:${(Math.cos(a)*r0)|0}px;top:${(Math.sin(a)*r0)|0}px;--x:${(Math.cos(a)*d)|0}px;--y:${(Math.sin(a)*d)|0}px;--s:${z}px;--c:${c[i%c.length]}"></u>`}
 return `<div class="dust" style="--sz:${sz}px"><b></b>${s}</div>`}

const TW=[[6,6,0],[262,40,.8],[20,300,1.6],[250,350,.4],[120,690,1.2],[262,700,2]];
function card(cf,d){
  const r=raceOf(d,cf.id)||{}, pct=r.pct||{}, c=r.cands||{}, vt=r.votes||{};
  const seatP=r.incumbent_party||cf.seat;
  const dName=c.D||cf.D||"", dOk=c.D?true:cf.dOk;
  const hasP=pct.R!=null||pct.D!=null, rep=r.reporting, df=(pct.R||0)-(pct.D||0);
  const fresh=freshAt[cf.id]!=null&&Date.now()-freshAt[cf.id]<4300, el=fresh?Date.now()-freshAt[cf.id]:0;
  let cw="", cls="", stt="", stamp="", seat="", sealH="";
  const t=`${esc(r.called_by||"")} 콜${r.time_kst?" · "+esc(r.time_kst)+" KST":""}`;
  if(r.winner){
    const flip=r.winner!==seatP, side=r.winner==="R"?"공화":(P[r.winner]||"");
    if(r.winner==="R"){cw="won";stt=`<div class="stt winl">당선 확정 · ${esc(r.called_by||"")} 콜${r.time_kst?" "+esc(r.time_kst)+" KST":""}</div>`;
      stamp="";sealH=`<div class="seal">${sealSVG(cf.st,r.called_by,r.time_kst)}<div class="gl"></div></div>`;
      seat=`<div class="seat gain h">${flip?"공화 탈환!":"공화 수성 ✔"}</div>`}
    else{cls="lost";stt=`<div class="stt loss h">패배<small>${side} 승리 · ${t}</small></div>`;
      stamp=`<div class="stamp loss h">패배<small>${esc(r.called_by||"")} 콜</small></div>`;
      seat=`<div class="seat lostg h">${side} ${flip?"탈환":"수성"}</div>`}
  } else {
    seat=`<div class="seat ${seatP} h">${seatP==="R"?"공화 수성전":"공화 탈환전"}</div>`;
    if(!hasP) stt=`<div class="stt pre h">개표 전<small>투표 마감 11/4 ${cf.close} KST</small></div>`;
    else{const lv=(vt.R!=null&&vt.D!=null)?Math.abs(vt.R-vt.D):null, lvs=lv!=null?` · ${lv.toLocaleString("ko-KR")}표 차`:"";
      stt=Math.abs(df)<1?`<div class="stt tie h">초접전<small>${df>0?"공화":df<0?"민주":"동률"} ${df?"+"+f1(Math.abs(df))+"%p":""}${lvs}</small></div>`:
        df>0?`<div class="stt leadR h">공화 리드 +${f1(df)}%p${lvs?`<small>${lvs.slice(3)} 앞섬</small>`:""}</div>`
            :`<div class="stt leadD h">민주 리드 +${f1(-df)}%p${lvs?`<small>${lvs.slice(3)} 앞섬</small>`:""}</div>`}
  }
  const lead=r.winner||(hasP?(df>0?"R":df<0?"D":""):"");
  const row=(p,name,ok,inc)=>`<div class="row ${p} ${lead===p?"lead":lead?"trail":""}"><div class="who">
     <span class="pt">${P[p]}${inc?`<span class="inc">현역</span>`:""}${r.winner===p?`<span class="ck">✔ 당선</span>`:""}</span>
     <span class="wn ${ok?"":"ph2"}">${ok&&name?esc(name):"후보 확인 필요"}</span>
     ${vt[p]!=null?`<span class="vt">${(+vt[p]).toLocaleString("ko-KR")}표</span>`:""}</div>
     <span class="pc h">${pct[p]!=null?f1(pct[p])+"<small>%</small>":"–"}</span></div>`;
  const tot=(pct.R||0)+(pct.D||0)||1;
  const tw=cw==="won"?TW.map(([x,y,dl])=>`<span class="tw" style="left:${x}px;top:${y}px;animation-delay:${dl}s">✦</span>`).join(""):"";
  return `<div class="cw ${cw} ${fresh&&cw==="won"?"fresh":""}" style="--d:-${el}ms"><div class="glow"></div><div class="card ${cls}">${d&&d.example?`<div class="exs">예시</div>`:""}
   <div class="ph"><img src="assets/sen_${cf.st}.png" alt=""><div class="pn"></div><div class="pe"></div><div class="code h">${cf.st}</div></div>
   ${seat}${stamp}
   <div class="nm"><div class="n h">${esc(cf.R)}</div><div class="s">${cf.stKo} · ${cf.st}</div></div>
   <div class="res">${stt}${row("R",cf.R,true,cf.incR)}${row("D",dName,dOk,cf.incD)}
    <div class="mbar"><i class="r" style="width:${hasP?(pct.R||0)/tot*100:0}%"></i><i class="d" style="width:${hasP?(pct.D||0)/tot*100:0}%"></i><b></b></div>
    <div class="rep"><span>예상 개표율${cf.note?`<em class="tg">${cf.note}</em>`:""}</span><b class="h">${rep!=null?esc(rep)+"%":"–"}</b></div><div class="rb"><i style="width:${Math.min(100,+rep||0)}%"></i></div>
   </div>${fresh&&cw==="won"?fxHTML(cf,el):""}</div>${sealH}${tw}</div>`;
}
const CROWN=`<svg class="crown" viewBox="0 0 44 30"><path d="M3 26 L1 7 L12 15 L22 2 L32 15 L43 7 L41 26 Z" fill="#D9BE7C" stroke="#EDDCAA" stroke-width="1.2"/><rect x="3" y="26" width="38" height="3.5" rx="1" fill="#B8954A"/><circle cx="22" cy="2.5" r="2.4" fill="#EDDCAA"/><circle cx="1.5" cy="7" r="2" fill="#EDDCAA"/><circle cx="42.5" cy="7" r="2" fill="#EDDCAA"/></svg>`;
function render(){const d=DATA;

    <span class="clk h"><span id="clk">${kst()}</span><small>KST${d&&d.updated_kst?" · 데이터 "+esc(d.updated_kst)+" 갱신":""}</small></span></div>`;
  if(d&&d.example)h+=`<div class="ex">예시 데이터 · 실제 결과 아님</div><div class="exmark"><span style="left:160px;top:560px">예시</span><span style="left:860px;top:760px">예시</span><span style="left:1500px;top:520px">예시</span></div>`;
  document.getElementById("app").innerHTML=h;
}
function apply(d){if(JSON.stringify(d)===JSON.stringify(DATA))return;
  const called=new Set(CARDS.map(c=>raceOf(d,c.id)).filter(r=>r&&r.winner).map(r=>r.id+r.winner));
  let burst=false;
  if(seen&&!Q.has("noflash")&&!Q.has("static")){const nf=[...called].filter(x=>!seen.has(x));
    for(const x of nf){const id=x.slice(0,6);if(x.endsWith("R")){freshAt[id]=Date.now();burst=true;setTimeout(()=>{delete freshAt[id];render()},4400)}}}
  seen=called;DATA=d;render();
  if(burst){const f=document.createElement("div");f.className="scrflash";document.getElementById("app").appendChild(f)}}
// ── 데이터 경로: tracker/index.html 과 같은 코드 (파일 폴링 + ntfy 라이브 + GitHub live.txt 백업) ──
let lastOk=0, fails=0;
const LIVE=Q.get("live")==="ntfy", TOPIC=Q.get("topic")||"", NTFY=(Q.get("server")||"https://ntfy.sh").replace(/\/$/,""),
      API=Q.get("api")||"", KEY=new URLSearchParams(location.hash.slice(1)).get("k")||"";
let BASE=null, LV=null, lastLive=0, lastAlive=0;
function conn(on,msg){const c=document.getElementById("conn");c.classList.toggle("on",on);if(on)c.textContent=msg}
function ago(t){return t?Math.round((Date.now()-t)/1000)+"초 전":"없음"}
function builtin(){return {example:false,updated_kst:"",races:CARDS.map(c=>({id:c.id,winner:null,called_by:null,time_kst:null,cands:{},pct:{},reporting:null}))}}
function ok(d){if(!d||!d.races)return bad();lastOk=Date.now();fails=0;
  if(LIVE){BASE=d;apply(LV?merge(BASE,LV):d);return}
  conn(false);apply(d)}
function bad(){fails++;if(LIVE){if(!BASE){BASE=builtin();apply(LV?merge(BASE,LV):BASE)}return}
  if(!DATA)apply(builtin());          // 데이터가 아예 없으면 '개표 전' 화면
  if(fails>=2)conn(true,"연결 재시도 중… 마지막 갱신 "+ago(lastOk))}
function loadScript(){const s=document.createElement("script");s.src=(Q.get("datajs")||"data.js")+"?t="+Date.now();
  s.onload=()=>{ok(window.BOARD_DATA);s.remove()};s.onerror=()=>{bad();s.remove()};document.head.appendChild(s)}
const DATA_URL=Q.get("data")||"data.json";
function poll(){const ctl=new AbortController();const to=setTimeout(()=>ctl.abort(),8000);
  fetch(DATA_URL+(DATA_URL.includes("?")?"&":"?")+"t="+Date.now(),{cache:"no-store",signal:ctl.signal})
  .then(r=>{if(!r.ok)throw 0;return r.json()}).then(ok)
  .catch(()=>{if(location.protocol==="file:"&&!Q.get("data"))loadScript();else bad()}).finally(()=>clearTimeout(to))}
poll();setInterval(poll,LIVE?60000:INTERVAL);
// 라이브 스냅샷(compact v1) → 이 장면의 6개 레이스에 반영. c=콜 [승자,콜기관,시각,코커스], p=[개표율,R%,D%], n(선택)=[R이름,D이름]
function merge(base,L){const d=JSON.parse(JSON.stringify(base));d.example=L.x;d.updated_kst=L.u||d.updated_kst;
  for(const cf of CARDS){let r=d.races.find(x=>x.id===cf.id);if(!r){r={id:cf.id,cands:{},pct:{}};d.races.push(r)}
    const c=(L.c||{})[r.id];r.winner=c?c[0]:null;r.called_by=c?c[1]||null:null;r.time_kst=c?c[2]||null:null;r.caucus=c?c[3]||null:null;
    const p=(L.p||{})[r.id];if(p){r.reporting=p[0];r.pct={};if(p[1]!=null)r.pct.R=p[1];if(p[2]!=null)r.pct.D=p[2];if(p.length>3){r.votes={};if(p[3]!=null)r.votes.R=p[3];if(p[4]!=null)r.votes.D=p[4]}else delete r.votes}else{r.reporting=null;r.pct={};delete r.votes}
    const n=(L.n||{})[r.id];if(n){r.cands=Object.assign({},r.cands||{});if(n[1])r.cands.D=n[1]}}
  return d}
const hex=b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("");
let hkey=null;
async function verify(msg){const i=msg.indexOf(".");if(i!==64)return null;const sig=msg.slice(0,64),body=msg.slice(65);
  if(KEY){if(!(window.crypto&&crypto.subtle))return null;
    hkey=hkey||await crypto.subtle.importKey("raw",new TextEncoder().encode(KEY),{name:"HMAC",hash:"SHA-256"},false,["sign"]);
    if(hex(await crypto.subtle.sign("HMAC",hkey,new TextEncoder().encode(body)))!==sig)return null}
  try{const o=JSON.parse(body);return o&&o.v===1&&o.c?o:null}catch(e){return null}}
async function liveMsg(msg){const o=await verify(msg);if(!o)return;
  if(LV&&o.s&&LV.s&&o.s<LV.s)return;
  LV=o;lastLive=Date.now();apply(merge(BASE||builtin(),LV))}
if(LIVE&&TOPIC){
  const es=new EventSource(NTFY+"/"+encodeURIComponent(TOPIC)+"/sse?since=latest");
  es.onopen=()=>{lastAlive=Date.now()};
  es.onmessage=e=>{lastAlive=Date.now();try{const m=JSON.parse(e.data);if(m.event==="message"&&m.message)liveMsg(m.message)}catch(x){}};
  if(API)setInterval(apiPoll,90000),setTimeout(apiPoll,1500);
  setInterval(()=>{const silent=Date.now()-lastAlive>100000;
    if(silent&&!(API&&Date.now()-lastLive<200000))conn(true,"연결 재시도 중… 마지막 갱신 "+ago(lastLive||lastOk));else conn(false)},5000)}
function apiPoll(){fetch("https://api.github.com/repos/"+API+"/contents/live.txt",{headers:{Accept:"application/vnd.github.raw"},cache:"no-store"})
  .then(r=>{if(!r.ok)throw 0;return r.text()}).then(t=>liveMsg(t.trim())).catch(()=>{})}
setInterval(()=>{const c=document.getElementById("clk");if(c)c.textContent=kst()},1000);
