<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<title>GODDESS NETWORK · 트럼프 지지 후보 성적 (투명 오버레이)</title>
<meta name="viewport" content="width=1920">
<style>
@font-face{font-family:"BHS";src:url("fonts/BlackHanSans-Regular.ttf")}
:root{--navy:#0A1630;--navy2:#10234A;--navy3:#183463;--g1:#FADBA3;--g2:#EABD7D;--g3:#CE9B60;--gd:#8A6532;--cream:#F7F1E3;--r2:#FF5A66;--ok:#9BE3A6}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:transparent!important;color:var(--cream);
font-family:"Pretendard","Malgun Gothic","Noto Sans KR","Gothic A1","NanumGothic","Apple SD Gothic Neo",sans-serif}
.h{font-family:"BHS","Malgun Gothic","Noto Sans KR",sans-serif;font-weight:400;letter-spacing:.5px}
.em{font-family:"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif;font-size:.86em;margin-right:5px}
/* 금색 3D 광택 글자 (03_control_math 와 같은 팔레트: base #EABD7D · light #FADBA3 · dark #CE9B60) */
.gold{position:relative;display:inline-block;color:transparent;
background:linear-gradient(180deg,#FFF3D2 0%,#FADBA3 24%,#EABD7D 49.5%,#CE9B60 50.5%,#E2B070 76%,#FADBA3 100%);
-webkit-background-clip:text;background-clip:text;
filter:drop-shadow(0 1px 0 #9a7038) drop-shadow(0 2px 0 #86592a) drop-shadow(0 3px 0 #724a22) drop-shadow(0 5px 7px rgba(0,0,0,.6))}
.gold::after{content:attr(data-t);position:absolute;left:0;top:0;white-space:pre;color:transparent;
background:linear-gradient(105deg,transparent 38%,rgba(255,255,255,.95) 50%,transparent 62%) 0 0/260% 100%;
-webkit-background-clip:text;background-clip:text;animation:shim 4.6s ease-in-out infinite}
@keyframes shim{0%{background-position:150% 0}55%,100%{background-position:-60% 0}}
body.static *,body.static *::before,body.static *::after{animation:none!important;transition:none!important}

/* 위치: 1920×1080 장면의 한 모서리. &pos=tl|tr|bl|br  &mx= &my= (모서리에서 떨어진 px)  &scale= */
#wrap{position:absolute;width:460px;transform-origin:var(--ox) var(--oy)}
#panel{position:relative;padding:14px 20px 12px;border-radius:18px;border:2px solid rgba(234,189,125,.78);
background:linear-gradient(160deg,rgba(24,52,99,.90),rgba(8,18,42,.93));
box-shadow:0 0 28px rgba(234,189,125,.26),0 8px 24px rgba(0,0,0,.45),inset 0 0 40px rgba(0,0,0,.42);animation:pIn .8s cubic-bezier(.2,1,.3,1) both}
body.nobg #panel{background:none;box-shadow:none;border-color:transparent}
body.nobg .gold,body.nobg .num,body.nobg .lab,body.nobg .last{text-shadow:0 2px 6px rgba(0,0,0,.85)}
@keyframes pIn{from{opacity:0;transform:translateY(14px) scale(.96)}}
#panel::before{content:"";position:absolute;left:10px;right:10px;top:0;height:2px;background:linear-gradient(90deg,transparent,var(--g1),transparent);opacity:.9}
.hd{display:flex;align-items:center;justify-content:space-between;height:42px}
.hd .t{font-size:34px;line-height:1.1;white-space:nowrap}
.tag{font-size:13px;font-weight:800;color:#3a2606;background:linear-gradient(180deg,var(--g1),var(--g3));border-radius:999px;padding:2px 10px;opacity:0;transition:opacity .3s}
.tag.on{opacity:1}
.gl{height:3px;margin:6px 0 10px;background:linear-gradient(90deg,transparent,var(--g3) 12%,var(--g1) 50%,var(--g3) 88%,transparent)}
.cnt{display:flex;gap:8px}
.tile{flex:1;text-align:center;border-radius:12px;padding:6px 2px 4px;background:rgba(255,255,255,.055);border:1px solid rgba(250,219,163,.22);transition:background .3s,border-color .3s,box-shadow .3s}
.tile .lab{font-size:17px;font-weight:800;color:var(--cream);white-space:nowrap}
.tile .num{font-size:54px;line-height:1.05;display:block;font-variant-numeric:tabular-nums}
.tile.w .num{color:var(--g1)}.tile.l .num{color:var(--r2)}.tile.p .num{color:var(--cream);opacity:.92}
.tile.pop{animation:pop .75s cubic-bezier(.2,1.5,.4,1)}
.tile.w.pop{background:rgba(250,219,163,.22);border-color:var(--g1);box-shadow:0 0 20px rgba(250,219,163,.55)}
.tile.l.pop{background:rgba(255,90,102,.20);border-color:var(--r2);box-shadow:0 0 18px rgba(255,90,102,.45)}
@keyframes pop{0%{transform:scale(1)}30%{transform:scale(1.13)}100%{transform:scale(1)}}
.wr{display:flex;align-items:center;gap:12px;margin-top:10px}
.wr .k{font-size:22px;font-weight:800;color:var(--g1);letter-spacing:1px;white-space:nowrap}
.wr .big{font-size:52px;line-height:1;min-width:128px}
.wr .big.pop{animation:pop .75s cubic-bezier(.2,1.5,.4,1)}
.wr .sub{font-size:15px;line-height:1.35;color:rgba(247,241,227,.82);margin-left:auto;text-align:right}
.wr .sub b{color:var(--g1);font-weight:800}
.bar{position:relative;height:9px;border-radius:5px;margin-top:6px;background:rgba(255,255,255,.12);overflow:hidden;box-shadow:inset 0 1px 3px rgba(0,0,0,.5)}
.bar i{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:5px;background:linear-gradient(180deg,#FFF3D2,#EABD7D 50%,#CE9B60)}
.bk{display:flex;gap:8px;margin-top:10px}
.chip{flex:1;border-radius:10px;padding:4px 4px 3px;text-align:center;background:rgba(0,0,0,.26);border:1px solid rgba(250,219,163,.16)}
.chip .n{font-size:15px;font-weight:800;color:var(--g1);letter-spacing:1px}
.chip .v{font-size:27px;line-height:1.1;font-variant-numeric:tabular-nums}
.chip .v s{text-decoration:none;opacity:.6;margin:0 1px}
.chip .t{font-size:12px;color:rgba(247,241,227,.62);margin-top:1px}
.last{height:22px;margin-top:8px;font-size:16px;font-weight:700;color:var(--g1);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:0;transition:opacity .5s}
.last.on{opacity:1}.last.l{color:var(--r2)}
#dbg{position:absolute;left:0;top:-22px;font-size:12px;color:#fff;background:rgba(0,0,0,.6);padding:1px 6px;border-radius:4px;display:none;white-space:nowrap}
body.debug #dbg{display:block}
</style></head>

function tween(id,to,fmt,onStep){const el=$(id);fmt=fmt||(v=>String(Math.round(v)));
  const from=cur[id]==null?0:cur[id];if(el._raf)cancelAnimationFrame(el._raf);
  if(from===to||DUR===0){cur[id]=to;el.textContent=fmt(to);if(onStep)onStep(to);return}
  const t0=performance.now();
  const step=now=>{const p=Math.min(1,(now-t0)/DUR),e=1-Math.pow(1-p,3),v=from+(to-from)*e;cur[id]=v;el.textContent=fmt(v);if(onStep)onStep(v);
    if(p<1)el._raf=requestAnimationFrame(step);else{cur[id]=to;el.textContent=fmt(to);if(onStep)onStep(to)}};
  el._raf=requestAnimationFrame(step)}

  const R=rng(+Q.get("seed")||6),ids=[...ENDSET],pick=k=>ids.filter(i=>kindOf(i)===k).sort(()=>R()-.5);
  const sen=pick("SEN"),gov=pick("GOV"),hou=pick("HOUSE").slice(0,Math.min(60,+Q.get("dn")||48)),seq=[];
  const mx=Math.max(sen.length,gov.length,hou.length);for(let i=0;i<mx;i++){for(const a of [hou,sen,gov])if(a[i])seq.push(a[i])}   // 하원·상원·주지사 번갈아
  const uniq=[...new Set(seq)].slice(0,+Q.get("dn")||60);
  const dint=(+Q.get("dint")||1.4)*1000;let i=0,c={};
  const step=()=>{if(i>=uniq.length){if(i>=uniq.length+3){i=0;c={};setCalls({},true,true);return}i++;return}
    const id=uniq[i++],r=R(),win=r<(+Q.get("winp")||.72);c=Object.assign({},c);c[id]=win?"R":(R()<.9?"D":"I");setCalls(c,true)};
  setCalls({},true,true);dbg("demo");setTimeout(()=>{step();setInterval(step,dint)},+Q.get("dstart")||800);
} else {
  /* 새로고침해도 유지: 저장된 결과를 먼저 보여주고, 피드가 오면 그 상태로 교체 */
  const st=loadStore();if(st){restored=true;lastS=st.s||0;setCalls(st.calls,false,true);dbg("복원됨")}else setCalls({},false,true);
  const fromBoard=d=>{const c={};for(const r of allRaces(d))if(r.winner)c[String(r.id).toUpperCase()]=r.winner;return c};
  function okFile(d){if(!d||!d.races)return;BASE=d;ENDSET=endorsedSet(d);if(LIVE)return recomputeEnd(d);setCalls(fromBoard(d),d.example);dbg("파일 모드")}
  function loadScript(){const s=document.createElement("script");s.src=DATAJS_URL+"?t="+Date.now();s.onload=()=>{okFile(window.BOARD_DATA);s.remove()};s.onerror=()=>s.remove();document.head.appendChild(s)}
  function poll(){const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),8000);
    fetch(DATA_URL+(DATA_URL.includes("?")?"&":"?")+"t="+Date.now(),{cache:"no-store",signal:ctl.signal}).then(r=>{if(!r.ok)throw 0;return r.json()}).then(okFile)
     .catch(()=>{if(location.protocol==="file:"&&!Q.get("data"))loadScript()}).finally(()=>clearTimeout(to))}
  if(!LIVE){poll();setInterval(poll,INTERVAL)}
  else{
    poll();setInterval(poll,60000);   // 보드 data.json 은 지지 여부 필드(races[i].endorsed·data.endorsed)만 읽음
    const hex=b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("");let hkey=null;
    async function verify(msg){const i=msg.indexOf(".");if(i!==64)return null;const sig=msg.slice(0,64),body=msg.slice(65);
      if(KEY){if(!(window.crypto&&crypto.subtle))return null;
        hkey=hkey||await crypto.subtle.importKey("raw",new TextEncoder().encode(KEY),{name:"HMAC",hash:"SHA-256"},false,["sign"]);
        if(hex(await crypto.subtle.sign("HMAC",hkey,new TextEncoder().encode(body)))!==sig)return null}
      try{const o=JSON.parse(body);return o&&o.v===1&&o.c?o:null}catch(e){return null}}
    // 라이브 스냅샷(compact v1): c = {레이스id:[승자,콜기관,시각,코커스]} — 현재 콜 전체. 가장 새 서명 스냅샷(s)만 채택 → 순서가 뒤바뀐 옛 메시지 무시
    function useSnap(o,quiet){if(o.s&&lastS&&o.s<lastS)return;lastS=o.s||lastS;const c={};for(const id in o.c)if(o.c[id]&&o.c[id][0])c[id.toUpperCase()]=o.c[id][0];
      const first=!gotLive;gotLive=true;setCalls(c,o.x,quiet||first);dbg("라이브 연결됨 · 스냅샷 "+new Date().toLocaleTimeString("ko-KR",{hour12:false}))}
    let gotLive=false;
    async function liveMsg(msg){const o=await verify(msg);if(o)useSnap(o)}
    async function loadHist(){const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),6000);
      try{const r=await fetch(NTFY+"/"+encodeURIComponent(TOPIC)+"/json?poll=1&since="+encodeURIComponent(Q.get("since")||"12h"),{cache:"no-store",signal:ctl.signal});
        if(!r.ok)throw 0;const txt=await r.text();let best=null,lastId=null;
        for(const line of txt.split("\n")){if(!line.trim())continue;let m;try{m=JSON.parse(line)}catch(e){continue}
          if(m.event!=="message"||!m.message)continue;lastId=m.id||lastId;const o=await verify(m.message);if(o&&(!best||(o.s||0)>=(best.s||0)))best=o}
        return{best,lastId}}finally{clearTimeout(to)}}
    function startSSE(since){const es=new EventSource(NTFY+"/"+encodeURIComponent(TOPIC)+"/sse?since="+encodeURIComponent(since));
      es.onmessage=e=>{try{const m=JSON.parse(e.data);if(m.event==="message"&&m.message)liveMsg(m.message)}catch(x){}};
      es.onerror=()=>dbg("연결 재시도 중…")}
    function apiPoll(){fetch("https://api.github.com/repos/"+API+"/contents/live.txt",{headers:{Accept:"application/vnd.github.raw"},cache:"no-store"})
      .then(r=>{if(!r.ok)throw 0;return r.text()}).then(t=>liveMsg(t.trim())).catch(()=>{})}
    if(TOPIC){dbg("라이브 연결 중…");
      loadHist().then(h=>{if(h.best)useSnap(h.best,true);startSSE(h.lastId||"all")})
        .catch(()=>{startSSE("latest");const t=setInterval(()=>loadHist().then(h=>{clearInterval(t);if(h.best)useSnap(h.best,true)}).catch(()=>{}),20000)});
      if(API)setInterval(apiPoll,90000),setTimeout(apiPoll,1500)}
  }
}
</script></body></html>
