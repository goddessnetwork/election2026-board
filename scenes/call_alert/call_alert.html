<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<title>GODDESS NETWORK · 당선 확정 알림 오버레이 (투명)</title>
<style>
@font-face{font-family:"BHS";src:url("fonts/BlackHanSans-Regular.ttf")}
:root{--navy:#0A1630;--gold:#D9BE7C;--gold2:#EDDCAA;--gold3:#B8954A;--cream:#F7F1E3;--r:#E3002B;--r2:#FF4058;--d:#0A5BD6;--d2:#55A0FF}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:transparent!important;color:var(--cream);
font-family:"Pretendard","Malgun Gothic","Noto Sans KR","Gothic A1","NanumGothic",sans-serif}
.h{font-family:"BHS","Malgun Gothic",sans-serif;font-weight:400;letter-spacing:.5px}
#stage{position:absolute;inset:0;pointer-events:none}
.al{position:absolute;inset:0;--T:7.4s}
.al.D,.al.I{--T:6s}
/* 공통: 전체 퇴장 */
.al{animation:alOut .6s ease-in calc(var(--T) - .6s) both}
@keyframes alOut{to{opacity:0;transform:scale(.96)}}
/* 화면 플래시·광선·버스트 (공화만) */
.flash{position:absolute;inset:0;background:radial-gradient(1100px 700px at 50% 56%,rgba(255,236,170,.85),rgba(217,190,124,.35) 45%,transparent 75%);opacity:0;animation:flash 1.1s ease-out both}
@keyframes flash{0%{opacity:0}12%{opacity:1}100%{opacity:0}}
.dim{position:absolute;inset:0;background:radial-gradient(1400px 700px at 50% 58%,rgba(4,10,26,.72),rgba(4,10,26,.35) 60%,transparent 85%);animation:fadeIn .4s ease-out both}
.al.D .dim,.al.I .dim{background:radial-gradient(1300px 520px at 50% 62%,rgba(4,10,26,.6),transparent 75%)}
@keyframes fadeIn{from{opacity:0}}
.rays{position:absolute;left:960px;top:600px;width:2200px;height:2200px;margin:-1100px 0 0 -1100px;border-radius:50%;
 background:repeating-conic-gradient(from 0deg,rgba(255,226,140,.30) 0deg 5deg,transparent 5deg 15deg);
 -webkit-mask-image:radial-gradient(circle,#000 8%,rgba(0,0,0,.5) 30%,transparent 62%);mask-image:radial-gradient(circle,#000 8%,rgba(0,0,0,.5) 30%,transparent 62%);
 animation:raysIn .9s ease-out .05s both,spin 24s linear infinite}
@keyframes raysIn{from{opacity:0;transform:scale(.3)}}
@keyframes spin{to{rotate:360deg}}
.burst{position:absolute;left:960px;top:600px;width:40px;height:40px;margin:-20px;border-radius:50%;
 background:radial-gradient(circle,#FFF8DC 0%,rgba(255,226,140,.9) 30%,rgba(217,190,124,0) 70%);animation:burst 1s cubic-bezier(.1,.7,.3,1) .05s both}
@keyframes burst{0%{transform:scale(.2);opacity:1}60%{opacity:.9}100%{transform:scale(60);opacity:0}}
/* 패널 */
.pn{position:absolute;left:250px;top:390px;width:1420px;height:420px;border-radius:22px;
 background:linear-gradient(180deg,rgba(22,44,92,.97),rgba(9,20,46,.97));border:4px solid var(--gold);
 box-shadow:0 0 0 2px rgba(0,0,0,.4),0 0 70px rgba(255,214,120,.55),0 24px 60px rgba(0,0,0,.6);
 animation:pnIn .7s cubic-bezier(.2,1.5,.4,1) .12s both}
@keyframes pnIn{from{opacity:0;transform:scale(.55)}}
.al.D .pn,.al.I .pn{top:470px;height:340px;border-color:#8FA9D8;box-shadow:0 0 0 2px rgba(0,0,0,.4),0 18px 50px rgba(0,0,0,.55);animation:pnUp .55s cubic-bezier(.2,.9,.3,1) .05s both}
@keyframes pnUp{from{opacity:0;transform:translateY(60px)}}
.pn .glowr{position:absolute;inset:-4px;border-radius:22px;border:4px solid #FFE9A8;opacity:0;animation:glw 2.2s ease-in-out .9s infinite}
@keyframes glw{50%{opacity:.85;box-shadow:0 0 40px rgba(255,226,140,.9)}}
/* 상단 띠 */
.top{position:absolute;left:400px;top:-26px;display:flex;gap:12px;align-items:center}
.al.D .top,.al.I .top{left:330px}
.brk{background:var(--r);color:#fff;font-size:30px;padding:6px 22px;border-radius:8px;border:2px solid #FFB3B9;box-shadow:0 4px 14px rgba(0,0,0,.5);animation:pop .45s cubic-bezier(.3,1.8,.5,1) .45s both}
.al.D .brk,.al.I .brk{background:#24365F;border-color:#8FA9D8}
.src{background:rgba(5,12,30,.92);border:2px solid var(--gold3);color:var(--gold2);font-size:24px;font-weight:800;padding:8px 18px;border-radius:8px;animation:pop .45s ease-out .6s both}
.exb{background:#F2C94C;color:#1a1a1a;font-size:22px;font-weight:900;padding:8px 14px;border-radius:8px;animation:pop .45s ease-out .6s both}
@keyframes pop{from{opacity:0;transform:scale(.4)}}
/* 사진 */
.ph{position:absolute;left:40px;top:-60px;width:330px;height:430px;border-radius:14px;overflow:hidden;border:5px solid var(--gold);
 background:#13285A;box-shadow:0 10px 30px rgba(0,0,0,.6),0 0 30px rgba(255,214,120,.5);animation:phIn .6s cubic-bezier(.2,1.3,.4,1) .35s both}
.ph img{width:100%;height:100%;object-fit:cover;object-position:50% 18%}
.ph .em{width:100%;height:100%}
@keyframes phIn{from{opacity:0;transform:translateX(-80px) rotate(-6deg)}}
.al.D .ph,.al.I .ph{left:40px;top:30px;width:250px;height:280px;border-color:#8FA9D8;box-shadow:0 10px 24px rgba(0,0,0,.5);animation:fadeIn .5s ease-out .25s both}
/* 텍스트 */
.tx{position:absolute;left:410px;right:40px;top:44px}
.al.D .tx,.al.I .tx{left:330px;top:44px}
.race{font-size:46px;color:var(--gold2);animation:slide .5s ease-out .55s both}
.race em{font-style:normal;font-size:28px;color:#fff;background:rgba(255,255,255,.12);border-radius:6px;padding:2px 12px;margin-left:12px;vertical-align:6px;font-family:"Pretendard","Malgun Gothic",sans-serif;font-weight:800}
.pty{display:inline-block;font-size:30px;padding:2px 14px;border-radius:6px;margin-right:16px;vertical-align:18px;color:#fff}
.pty.R{background:var(--r)}.pty.D{background:var(--d)}.pty.I{background:#6B7280}
.nm{font-size:112px;line-height:1.08;margin-top:6px;white-space:nowrap;animation:slide .55s cubic-bezier(.2,1.2,.4,1) .7s both}
.nm .n{background:linear-gradient(180deg,#FFF6D6 0%,#EDDCAA 40%,#C9A65A 75%,#F2D27A 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 0 #6B4F1E) drop-shadow(0 8px 16px rgba(0,0,0,.6))}
.al.D .nm,.al.I .nm{font-size:84px}
.al.D .nm .n,.al.I .nm .n{background:none;color:#fff;filter:drop-shadow(0 4px 10px rgba(0,0,0,.6))}
@keyframes slide{from{opacity:0;transform:translateX(50px)}}
.row2{display:flex;gap:22px;align-items:center;margin-top:18px}
.stamp{position:relative;overflow:hidden;font-size:76px;line-height:1;padding:12px 34px 14px;border-radius:12px;color:#3A2A08;
 background:linear-gradient(180deg,#FFF1C2,#E6C670 45%,#C49A3E);border:3px solid #FFF6D6;box-shadow:0 6px 0 #7A5A22,0 12px 30px rgba(0,0,0,.5),0 0 40px rgba(255,214,120,.6);
 animation:stamp .6s cubic-bezier(.2,2,.4,1) 1.05s both}
@keyframes stamp{0%{opacity:0;transform:scale(2.6) rotate(-8deg)}60%{opacity:1}100%{transform:scale(1) rotate(-2deg)}}
.stamp::after{content:"";position:absolute;top:-20%;bottom:-20%;width:90px;left:-140px;background:linear-gradient(100deg,transparent,rgba(255,255,255,.85),transparent);transform:skewX(-18deg);animation:shine 2.4s ease-in-out 1.6s infinite}
@keyframes shine{0%{left:-140px}45%,100%{left:120%}}
.al.D .stamp,.al.I .stamp{font-size:58px;color:#fff;background:linear-gradient(180deg,#2F86FF,#003DA5);border-color:#9DB8EE;box-shadow:0 5px 0 #132C61,0 10px 24px rgba(0,0,0,.45);animation:fadeIn .5s ease-out .7s both;transform:none}
.al.D .stamp::after,.al.I .stamp::after{display:none}
.flip{font-size:50px;padding:10px 26px;border-radius:12px;color:#fff;background:linear-gradient(180deg,#FF1F44,#B5001F);border:3px solid #FFC2C7;box-shadow:0 6px 18px rgba(0,0,0,.5);animation:pop2 .5s cubic-bezier(.3,1.9,.5,1) 1.45s both}
.flip.hold{background:linear-gradient(180deg,#E3002B,#8A0016);border-color:var(--gold)}
.al.D .flip,.al.I .flip{font-size:40px;background:#24365F;border-color:#8FA9D8;animation:fadeIn .5s ease-out .9s both}
@keyframes pop2{0%{opacity:0;transform:scale(.3)}100%{transform:scale(1)}}
/* 꽃가루 */
.cf{position:absolute;inset:0;overflow:hidden}
.cf i{position:absolute;top:-40px;left:var(--x);width:var(--w);height:var(--h);background:var(--c);border-radius:2px;opacity:0;
 animation:fall var(--t) cubic-bezier(.3,.2,.6,1) var(--dl) both}
.cf i.s{background:none;color:var(--c);font-style:normal;font-size:var(--w);width:auto;height:auto;text-shadow:0 0 10px rgba(255,230,150,.9)}
@keyframes fall{0%{opacity:1;transform:translate(0,0) rotate(0)}85%{opacity:1}100%{opacity:0;transform:translate(var(--dx),1160px) rotate(var(--r))}}
.bp{position:absolute;left:960px;top:600px}
.bp i{position:absolute;width:var(--w);height:var(--h);margin:-5px;background:var(--c);border-radius:2px;opacity:0;animation:bp var(--t) cubic-bezier(.1,.8,.3,1) var(--dl) both}
.bp i.s{background:none;color:var(--c);font-style:normal;font-size:var(--w);width:auto;height:auto;text-shadow:0 0 10px rgba(255,230,150,.9)}
@keyframes bp{0%{opacity:1;transform:translate(0,0) scale(.4) rotate(0)}70%{opacity:1}100%{opacity:0;transform:translate(var(--bx),var(--by)) scale(1) rotate(var(--r))}}
/* ── 금빛 인장(공화 당선 확정) ── */
.seal{position:absolute;z-index:6;transform:rotate(-12deg);filter:drop-shadow(0 6px 8px rgba(0,0,0,.55)) drop-shadow(0 0 12px rgba(255,214,120,.55))}
.seal svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.seal .gl{position:absolute;inset:7%;border-radius:50%;overflow:hidden;pointer-events:none}
.seal .gl::after{content:"";position:absolute;top:-20%;bottom:-20%;left:0;width:42%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.7) 50%,transparent);transform:translateX(-160%) skewX(-18deg);animation:sweep 3.6s ease-in-out infinite}
@keyframes sweep{0%,55%{transform:translateX(-160%) skewX(-18deg)}85%,100%{transform:translateX(330%) skewX(-18deg)}}
@keyframes slam{0%{opacity:0;transform:translateY(-50px) rotate(-30deg) scale(3.2);animation-timing-function:cubic-bezier(.6,0,1,.7)}
 55%{opacity:1;transform:rotate(-12deg) scale(.88);animation-timing-function:ease-out}75%{transform:rotate(-12deg) scale(1.07)}100%{opacity:1;transform:rotate(-12deg) scale(1)}}
@keyframes shake{0%{transform:translate(0,0)}15%{transform:translate(-6px,4px)}30%{transform:translate(5px,-4px)}45%{transform:translate(-4px,3px)}60%{transform:translate(3px,-2px)}80%{transform:translate(-1px,1px)}100%{transform:translate(0,0)}}
.dust{position:absolute;width:0;height:0;pointer-events:none}
.dust b{position:absolute;left:calc(var(--sz)/-2);top:calc(var(--sz)/-2);width:var(--sz);height:var(--sz);border-radius:50%;border:6px solid rgba(255,232,165,.95);box-shadow:0 0 22px rgba(255,220,140,.9),inset 0 0 18px rgba(255,220,140,.6);opacity:0;animation:ring .6s ease-out both;animation-delay:var(--imp)}
@keyframes ring{0%{transform:scale(.55);opacity:0}1%{transform:scale(.56);opacity:1}100%{transform:scale(1.9);opacity:0}}
.dust u{position:absolute;width:var(--s);height:var(--s);margin:calc(var(--s)/-2);border-radius:50%;background:var(--c);opacity:0;box-shadow:0 0 4px rgba(255,220,140,.8);
 animation:dust .9s cubic-bezier(.1,.8,.3,1) both;animation-delay:var(--imp)}
@keyframes dust{0%{opacity:0;transform:translate(0,0) scale(1)}1%{opacity:1;transform:translate(0,0) scale(1)}100%{opacity:0;transform:translate(var(--x),var(--y)) scale(.4)}}
.al.R .seal{left:250px;top:200px;width:240px;height:240px;z-index:7;animation:slam .45s both 1s}
.al.R .pn{animation:pnIn .7s cubic-bezier(.2,1.5,.4,1) .12s both,shake .4s ease-out 1.25s}
.al.R .pn>.dust{left:370px;top:320px;z-index:6;--imp:1.25s}
.flash2{position:absolute;inset:0;background:radial-gradient(760px 520px at 620px 710px,rgba(255,240,190,.8),transparent 70%);opacity:0;animation:flash .8s ease-out 1.25s both}
.al.R .tx,.al.R .top{left:490px}
.al.R .nm{font-size:104px}
.winl{font-size:36px;color:#FFE9A8;padding:8px 26px;border-top:2px solid var(--gold);border-bottom:2px solid var(--gold);
 background:linear-gradient(90deg,rgba(217,190,124,0),rgba(217,190,124,.26) 15%,rgba(217,190,124,.26) 85%,rgba(217,190,124,0));animation:fadeIn .5s ease-out 1.45s both}
/* 끄기 옵션 */
body.nofx .flash,body.nofx .flash2,body.nofx .dust,body.nofx .rays,body.nofx .burst,body.nofx .cf,body.nofx .bp{display:none}
body.nofx .al .seal,body.nofx .al .pn{animation:fadeIn .4s ease-out both}
body.nofx .pn,body.nofx .ph,body.nofx .stamp,body.nofx .flip,body.nofx .brk,body.nofx .nm{animation:fadeIn .4s ease-out both}
body.static *,body.static *::after{animation:none!important}
body.static .flash,body.static .flash2,body.static .dust,body.static .rays,body.static .burst,body.static .cf,body.static .bp{display:none}
/* ── 상원/하원 구분: 패널은 둘 다 네이비·골드. 상단 띠의 작은 의회 태그로만 구분 (상원 빨강 / 하원 은색) ── */
.chm{font-size:26px;padding:6px 16px 5px;border-radius:8px;border:2px solid var(--gold);box-shadow:0 4px 14px rgba(0,0,0,.5);animation:pop .45s ease-out .55s both;white-space:nowrap}
.chm.sen{background:linear-gradient(180deg,#E3002B,#8A0016);color:#fff}
.chm.hou{background:linear-gradient(180deg,#FFFFFF,#DCE2EA 50%,#9AA4B2);color:#0A1630;text-shadow:0 1px 0 rgba(255,255,255,.7)}

.jp-back,.jp-front{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:hidden;pointer-events:none}
.jp-back{z-index:0}.jp-front{z-index:4}
.fw-r{position:absolute;width:6px;height:90px;margin-left:-3px;background:linear-gradient(180deg,#fff,var(--c) 45%,transparent);opacity:0;animation:jpR .55s cubic-bezier(.25,.6,.45,1) var(--d) forwards}
@keyframes jpR{0%{opacity:1;transform:translateY(var(--h))}85%{opacity:1}100%{opacity:0;transform:translateY(0)}}
.fw-b{position:absolute;width:0;height:0}
.fw-g{position:absolute;width:420px;height:420px;margin:-210px 0 0 -210px;border-radius:50%;background:radial-gradient(circle,#fff 0,var(--c) 22%,transparent 62%);opacity:0;animation:jpG .8s ease-out var(--d) both}
@keyframes jpG{0%{opacity:0;transform:scale(.2)}15%{opacity:.5}100%{opacity:0;transform:scale(1.1)}}
.fw-b u,.fw-b i{position:absolute;display:block;width:var(--s);height:var(--s);margin:calc(var(--s)/-2);border-radius:50%;background:var(--c);opacity:0;text-decoration:none;animation:jpS var(--t) cubic-bezier(.12,.75,.3,1) var(--dl) forwards}
.fw-b u{box-shadow:0 0 12px 2px var(--c)}
.fw-b i.fw-t{animation-name:jpT}
@keyframes jpS{0%{opacity:1;transform:translate(0,0) scale(1)}55%{opacity:1;transform:translate(calc(var(--x)*.92),calc(var(--y)*.92)) scale(.9)}80%{opacity:.8}100%{opacity:0;transform:translate(var(--x),calc(var(--y) + 110px)) scale(.3)}}
@keyframes jpT{0%{opacity:.6;transform:translate(0,0) scale(1)}55%{opacity:.55;transform:translate(calc(var(--x)*.92),calc(var(--y)*.92)) scale(.9)}100%{opacity:0;transform:translate(var(--x),calc(var(--y) + 110px)) scale(.3)}}
.cn{position:absolute;width:var(--sz);height:var(--sz);opacity:0;animation:jpX var(--t) linear var(--dl) both,jpO var(--t) linear var(--dl) both}
@keyframes jpX{from{transform:translateX(0)}to{transform:translateX(calc(var(--dx)*1px))}}
@keyframes jpO{0%{opacity:0}3%{opacity:1}90%{opacity:1}100%{opacity:0}}
.cy{width:100%;height:100%;animation:jpY var(--t) linear var(--dl) both}
@keyframes jpY{0%{transform:translateY(0);animation-timing-function:cubic-bezier(.2,.75,.4,1)}38%{transform:translateY(calc(var(--pk)*-1px));animation-timing-function:cubic-bezier(.6,0,.9,.5)}70%{transform:translateY(0);animation-timing-function:cubic-bezier(.2,.75,.4,1)}79%{transform:translateY(calc(var(--pk)*-.12px));animation-timing-function:cubic-bezier(.6,0,.9,.5)}88%,100%{transform:translateY(0)}}
.cc{position:relative;width:100%;height:100%;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFF6D6 0,#FADBA3 26%,#EABD7D 58%,#CE9B60 100%);border:4px solid #CE9B60;box-shadow:inset 0 0 0 3px #FADBA3,inset 0 -5px 7px rgba(120,76,20,.5),0 3px 0 #8A5E20;animation:jpS2 var(--sp) linear infinite}
@keyframes jpS2{0%{transform:rotate(0) scaleX(1)}25%{transform:rotate(90deg) scaleX(.06)}50%{transform:rotate(180deg) scaleX(-1)}75%{transform:rotate(270deg) scaleX(.06)}100%{transform:rotate(360deg) scaleX(1)}}
.cc::before{content:"\2605";position:absolute;left:0;top:0;width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:calc(var(--sz)*.52);line-height:1;color:#DDA94E;text-shadow:0 1px 0 #FFF1C2,0 -1px 0 #9A6A25}
.cc::after{content:"";position:absolute;left:14%;top:12%;width:30%;height:30%;border-radius:50%;background:radial-gradient(circle,#fff,rgba(255,255,255,0) 70%);opacity:0;animation:jpGl .9s ease-in-out var(--gd) infinite}
@keyframes jpGl{0%,100%{opacity:0}45%{opacity:1}}
/* 퍼지는 원형 띠 제거(빛줄기 .rays 로 대체) */
.dust b{display:none!important}
body.nofx .jp-back,body.nofx .jp-front,body.static .jp-back,body.static .jp-front{display:none}

/* ══ BADGE-NEW (2026-11-03) 새 당선 배지(PNG/WebP): 스케일 팝 + 광택(배지 모양 마스크) + 반짝이 + 골드 글로우. &badge=old → 예전 SVG 인장 ══ */
.seal.nb{transform:none;filter:none;--g1:#FADBA3;--g2:#EABD7D;--g3:#CE9B60}
.cw.fresh>.seal.nb,.al.R .seal.nb{animation:none}
.nb .gw{position:absolute;left:-26%;top:-26%;width:152%;height:152%;border-radius:50%;pointer-events:none;opacity:.85;
 background:radial-gradient(circle,rgba(250,219,163,.80) 0%,rgba(234,189,125,.50) 34%,rgba(206,155,96,.20) 54%,rgba(206,155,96,0) 70%);animation:nbBreathe 2.8s ease-in-out infinite}
@keyframes nbBreathe{0%,100%{opacity:.62;transform:scale(.94)}50%{opacity:1;transform:scale(1.07)}}
.nb .bd{position:absolute;inset:0;transform:rotate(-5deg);
 filter:drop-shadow(0 0 1.2px rgba(60,32,4,.9)) drop-shadow(0 5px 6px rgba(0,0,0,.55))}

const SFXON=!Q.has("nosfx"), SFXFULL=Q.has("sfxfull"), SFXGOV=Q.get("govsfx")!=="0";

let sfxCur=null,sfxFadeT=0,sfxFadeI=0;

if(SFXON&&SFXV>0){for(const k in SFXFILE){try{const a=new Audio(SFXFILE[k]);a.preload="auto";a.onerror=()=>{};SFXA[k]=a}catch(e){}}}   // 미리 불러오기
function sfxStop(ms){clearTimeout(sfxFadeT);clearInterval(sfxFadeI);const a=sfxCur;sfxCur=null;if(!a)return;
  try{if(!ms){a.pause();return}const t0=performance.now(),v0=a.volume;
    sfxFadeI=setInterval(()=>{const k=Math.min(1,(performance.now()-t0)/ms);try{a.volume=Math.max(0,v0*(1-k))}catch(e){}if(k>=1){clearInterval(sfxFadeI);try{a.pause()}catch(e){}}},40)}catch(e){}}
function sfxPlay(al,durMs){if(!SFXON||SFXV<=0)return;
  const key=al.off==="HOUSE"?"HOUSE":(al.off==="GOV"&&!SFXGOV)?null:"SEN";if(!key)return;
  try{sfxStop(0);const a=SFXA[key]||(SFXA[key]=new Audio(SFXFILE[key]));
    try{a.currentTime=0}catch(e){}a.volume=SFXV;sfxCur=a;
    const p=a.play();sfxLog("play",key,SFXFILE[key],"vol="+SFXV.toFixed(2),"race="+(al.id||""));
    if(p&&p.catch)p.catch(()=>{sfxLog("blocked-by-autoplay-policy (ignored)")});
    if(!SFXFULL){const fo=700;sfxFadeT=setTimeout(()=>{if(sfxCur===a)sfxStop(fo-100)},Math.max(300,durMs-fo))}   // 알림 퇴장(.6초)에 맞춰 사라지게
  }catch(e){}}

  let i=0;const step=()=>{if(!busy&&!queue.length){const x=seq[i++%seq.length];seen={};apply({example:true,races:[x]})}};
  setTimeout(step,600);setInterval(step,1000);
} else {
// ── 데이터 경로: tracker/index.html·senate_cards 와 같은 코드 (파일 폴링 + ntfy 라이브 + GitHub live.txt 백업) ──
const LIVE=Q.get("live")==="ntfy", TOPIC=Q.get("topic")||"", NTFY=(Q.get("server")||"https://ntfy.sh").replace(/\/$/,""),
      API=Q.get("api")||"", KEY=new URLSearchParams(location.hash.slice(1)).get("k")||"", T0=Date.now()/1000;
let BASE=null, LV=null;
function ok(d){if(!d||!d.races)return;if(LIVE){BASE=d;tryHist();return}apply(d)}
function loadScript(){const s=document.createElement("script");s.src=(Q.get("datajs")||"data.js")+"?t="+Date.now();
  s.onload=()=>{ok(window.BOARD_DATA);s.remove()};s.onerror=()=>s.remove();document.head.appendChild(s)}
const DATA_URL=Q.get("data")||"data.json";
function poll(){const ctl=new AbortController();const to=setTimeout(()=>ctl.abort(),8000);
  fetch(DATA_URL+(DATA_URL.includes("?")?"&":"?")+"t="+Date.now(),{cache:"no-store",signal:ctl.signal})
  .then(r=>{if(!r.ok)throw 0;return r.json()}).then(ok)
  .catch(()=>{if(location.protocol==="file:"&&!Q.get("data"))loadScript()}).finally(()=>clearTimeout(to))}
poll();setInterval(poll,LIVE?60000:INTERVAL);
// 라이브 스냅샷(compact v1): c=콜 [승자,콜기관,시각,코커스], n(선택)=[R이름,D이름]
function merge(base,L){const d={example:L.x,races:[],baseline:base&&base.baseline,house:L.h?{R:L.h[0],D:L.h[1]}:(base&&base.house),endorsed:base&&base.endorsed,majority:L.mj||(base&&base.majority)};
  for(const id in (L.c||{})){const c=L.c[id],b=allRaces(base).find(x=>x.id===id)||{};
    const r=Object.assign({},b,{id,winner:c[0],called_by:c[1]||null,time_kst:c[2]||null,caucus:c[3]||b.caucus||null});
    const n=(L.n||{})[id];if(n){r.cands=Object.assign({},r.cands||{});if(n[0])r.cands.R=n[0];if(n[1])r.cands.D=n[1]}
    d.races.push(r)}
  for(const b of allRaces(base))if(!d.races.find(x=>x.id===b.id))d.races.push(Object.assign({},b,{winner:null}));
  return d}
const hex=b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("");
let hkey=null;
async function verify(msg){const i=msg.indexOf(".");if(i!==64)return null;const sig=msg.slice(0,64),body=msg.slice(65);
  if(KEY){if(!(window.crypto&&crypto.subtle))return null;
    hkey=hkey||await crypto.subtle.importKey("raw",new TextEncoder().encode(KEY),{name:"HMAC",hash:"SHA-256"},false,["sign"]);
    if(hex(await crypto.subtle.sign("HMAC",hkey,new TextEncoder().encode(body)))!==sig)return null}
  try{const o=JSON.parse(body);return o&&o.v===1&&o.c?o:null}catch(e){return null}}
// HIST = 시작할 때 ntfy 기록(최근 12시간)에서 읽은 '가장 새 서명 스냅샷' → 알림 없이 기준(seen)으로만 사용 (새로고침해도 옛 콜 팝업이 다시 뜨지 않음)
let HIST=null;
function tryHist(){if(!HIST||LV||!BASE)return;LV=HIST;HIST=null;seen=null;apply(merge(BASE,LV),false)}
async function liveMsg(msg,time){const o=await verify(msg);if(!o)return;
  if(!LV&&HIST){const h=HIST;HIST=null;if(!(o.s&&h.s&&o.s<h.s)){LV=h;seen=null;apply(merge(BASE,LV),false)}}   // 기록 기준선 먼저(아직 안 깔렸다면)
  if(LV&&o.s&&LV.s&&o.s<=LV.s&&JSON.stringify(o.c)===JSON.stringify(LV.c))return;
  if(LV&&o.s&&LV.s&&o.s<LV.s)return;
  const old=!!time&&Date.now()/1000-time>90;     // 재연결로 다시 받은 오래된 메시지는 기준만 갱신, 알림 없음
  // 기록이 전혀 없을 때만(예전 동작): 첫 라이브 메시지는 기준선(알림 없음). 단, 페이지를 연 뒤 보낸 메시지(s ≥ 열기 시각-5초)이고 미러 data.json 이 있으면
  // 그 data.json 대비 새 콜만 알림(한 번에 4개 넘으면 오래된 상태로 보고 기준선 처리).
  let cap=99;
  if(!LV){seen=null;if(!old&&o.s&&o.s>=T0-5&&BASE){apply(BASE,false);cap=4}}
  LV=o;apply(merge(BASE,LV),!old,cap)}
async function loadHist(){const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),6000);
  try{const r=await fetch(NTFY+"/"+encodeURIComponent(TOPIC)+"/json?poll=1&since="+encodeURIComponent(Q.get("since")||"12h"),{cache:"no-store",signal:ctl.signal});
    if(!r.ok)throw 0;const txt=await r.text();let best=null,lastId=null;
    for(const line of txt.split("\n")){if(!line.trim())continue;let m;try{m=JSON.parse(line)}catch(e){continue}
      if(m.event!=="message"||!m.message)continue;lastId=m.id||lastId;const o=await verify(m.message);if(o&&(!best||(o.s||0)>=(best.s||0)))best=o}
    return{best,lastId}}
  finally{clearTimeout(to)}}
function startSSE(since){const es=new EventSource(NTFY+"/"+encodeURIComponent(TOPIC)+"/sse?since="+encodeURIComponent(since));
  es.onmessage=e=>{try{const m=JSON.parse(e.data);if(m.event==="message"&&m.message)liveMsg(m.message,m.time)}catch(x){}}}
if(LIVE&&TOPIC){
  loadHist().then(h=>{if(h.best&&!LV){HIST=h.best;tryHist()}startSSE(h.lastId||"all")})        // 기록 마지막 id 부터 구독 → 사이 공백 없음
   .catch(()=>{startSSE("latest");const t=setInterval(()=>loadHist().then(h=>{clearInterval(t);if(h.best&&!LV){HIST=h.best;tryHist()}}).catch(()=>{}),20000)});
  if(API)setInterval(apiPoll,90000),setTimeout(apiPoll,1500)}
function apiPoll(){fetch("https://api.github.com/repos/"+API+"/contents/live.txt",{headers:{Accept:"application/vnd.github.raw"},cache:"no-store"})
  .then(r=>{if(!r.ok)throw 0;return r.text()}).then(t=>liveMsg(t.trim())).catch(()=>{})}
}
// 수동 트리거: &maj=R_SEN,R_HOUSE,D_SEN,D_HOUSE → 페이지를 연 직후 해당 다수당 배너 1회 (데모 아닐 때만)
if(!DEMO&&Q.get("maj")){const ks=[...new Set(Q.get("maj").split(",").map(x=>MJ_KEYS[x.trim().toUpperCase()]).filter(Boolean))];setTimeout(()=>ks.forEach(k=>enqueueMaj(k,{example:false})),1200)}
</script></body></html>
