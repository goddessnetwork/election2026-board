<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<title>GODDESS NETWORK · 2026 미국 중간선거 개표 보드</title>
<style>
@font-face{font-family:"BHS";src:url("fonts/BlackHanSans-Regular.ttf")}
:root{--navy:#0A1630;--navy2:#10234A;--navy3:#183463;--gold:#D9BE7C;--gold2:#EDDCAA;--cream:#F7F1E3;
--r:#E3002B;--d:#0A5BD6;--i:#8E7CC3;--grey:#4A5674;--line:rgba(217,190,124,.35)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:var(--navy);color:var(--cream);
font-family:"Pretendard","Malgun Gothic","Noto Sans KR","NanumGothic","Apple SD Gothic Neo",sans-serif}
.h{font-family:"BHS","Malgun Gothic",sans-serif;font-weight:400;letter-spacing:.5px}
#app{position:relative;width:1920px;height:1080px;
background:radial-gradient(1200px 600px at 15% 0%,#173263 0%,transparent 60%),linear-gradient(180deg,#0B1834,#08122A)}
.wm{position:absolute;right:28px;bottom:84px;width:110px;opacity:.16;pointer-events:none}
header{position:absolute;left:0;top:0;width:1920px;height:96px;display:flex;align-items:center;gap:22px;padding:0 40px;
border-bottom:2px solid var(--gold);background:linear-gradient(90deg,#0E2148,#0A1630 60%)}
header img{height:70px}
@font-face{font-family:"GMK";src:url("fonts/GmarketSansBold.woff") format("woff");font-weight:700}
header .t1{font-size:40px;color:var(--gold2)}
header .t1.h{font-family:"GMK","BHS","Malgun Gothic",sans-serif;font-weight:700;letter-spacing:-.3px;white-space:nowrap}
/* 큰 제목: 정제된 골드 그라데이션 + 7초마다 좁고 은은한 빛줄기. &static=1 이면 빛줄기만 멈춤(금색 유지) */
header .t1.h{width:fit-content;padding:0 4px;color:#F3DE9C;
 background-image:linear-gradient(100deg,rgba(255,255,255,0) 0%,rgba(255,255,255,0) 44%,rgba(255,251,236,.5) 50%,rgba(255,255,255,0) 56%,rgba(255,255,255,0) 100%),
  linear-gradient(180deg,#FFF5D6 0%,#F4DF9E 32%,#DDBB66 58%,#B98F3E 80%,#E2C47C 100%);
 background-size:200% 100%,100% 100%;background-repeat:no-repeat;background-position:130% 0,0 0;
 -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
 filter:drop-shadow(0 1px 0 #5E4114) drop-shadow(0 3px 6px rgba(0,0,0,.5));animation:tsw 7s ease-in-out infinite;animation-delay:var(--ph,0s)}
@keyframes tsw{0%,60%{background-position:130% 0,0 0}100%{background-position:-30% 0,0 0}}
html.static header .t1.h{animation:none}
header .t2{font-size:20px;color:var(--cream);opacity:.85;margin-top:2px}
header .sp{flex:1}
.live{background:var(--r);color:#fff;font-weight:800;padding:6px 14px;border-radius:6px;font-size:22px;letter-spacing:2px}
.clock{font-size:34px;color:var(--gold2);text-align:right}
.clock small{display:block;font-size:16px;color:var(--cream);opacity:.7;font-family:inherit}
.ex{position:absolute;z-index:50;top:30px;left:1000px;transform:translateX(-50%);background:#F2C94C;color:#1A1A1A;
font-weight:900;font-size:26px;padding:6px 26px;border-radius:999px;box-shadow:0 4px 20px rgba(0,0,0,.4);display:none}
.exmark{position:absolute;z-index:49;inset:0;display:none;pointer-events:none;
background:none}
.exmark span{position:absolute;font-weight:900;color:rgba(242,201,76,.22);font-size:120px;transform:rotate(-18deg)}
/* bars */
.bars{position:absolute;left:40px;top:120px;width:1150px}
.bar{height:138px;margin-bottom:14px;padding:12px 18px;border:1px solid var(--line);border-radius:14px;background:rgba(16,35,74,.75);position:relative}
.bar .top{display:flex;align-items:baseline;gap:16px}
.bar .lab{font-size:30px;color:var(--gold2);width:120px}
.bar .num{font-size:46px}
.bar .num.r{color:#FF4058}.bar .num.d{color:#55A0FF}
.bar .mid{flex:1;text-align:center;font-size:20px;opacity:.85}
.bar .mid.mj{font-size:28px;opacity:1;color:#0A1630;background:linear-gradient(90deg,var(--gold),var(--gold2));border-radius:10px;padding:4px 10px;align-self:center;box-shadow:0 0 18px rgba(217,190,124,.55)}
.bar .net{font-size:20px;color:var(--gold2);text-align:right;min-width:230px}
.track{position:relative;height:42px;margin-top:8px;border-radius:8px;overflow:visible;background:var(--grey);display:flex}
.seg{height:100%;transition:width .8s ease}
.seg.r{background:linear-gradient(180deg,#FF2A48,#B5001F)}.seg.d{background:linear-gradient(180deg,#2F86FF,#003DA5)}
.seg.i{background:var(--i)}.seg.u{background:rgba(88,106,148,.38)}
.seg.r{border-radius:8px 0 0 8px}.seg.d.last{border-radius:0 8px 8px 0}
.maj{position:absolute;top:-10px;bottom:-10px;width:4px;background:var(--gold2);box-shadow:0 0 8px var(--gold)}
.majl{position:absolute;top:-34px;transform:translateX(-50%);font-size:16px;color:var(--gold2);white-space:nowrap}
.sub{font-size:15px;opacity:.8;gap:12px;margin-top:6px;display:flex;justify-content:space-between}
/* video slot */
.vslot{position:absolute;border:3px dashed var(--gold);border-radius:12px;display:flex;align-items:center;justify-content:center;
color:var(--gold2);font-size:22px;text-align:center;background:rgba(0,0,0,.35)}
.side{position:absolute;left:1220px;top:518px;width:660px;height:56px;display:flex;align-items:center;gap:12px;
border:1px solid var(--line);border-radius:12px;padding:0 16px;background:rgba(16,35,74,.75);font-size:22px}
.side b{color:var(--gold2)}
/* grid */
.grid{position:absolute;left:40px;top:592px;width:1840px;display:grid;grid-template-columns:repeat(6,1fr);gap:12px}
.card{height:190px;border:1px solid var(--line);border-radius:12px;background:rgba(16,35,74,.85);padding:10px 12px;position:relative;overflow:hidden}
.card .st{font-size:24px;color:var(--gold2)}
.card .of{font-size:15px;opacity:.75;margin-left:6px}
.cand{display:flex;justify-content:space-between;align-items:center;font-size:19px;margin-top:6px;padding:3px 6px;border-radius:6px}
.cand .p{font-weight:800;font-size:21px}
.cand.lead{background:rgba(255,255,255,.08)}
.cand .dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
.rep{position:absolute;left:12px;right:12px;bottom:12px;font-size:14px;opacity:.85}
.rep .rb{height:6px;background:var(--grey);border-radius:4px;margin-top:4px}
.rep .rb i{display:block;height:100%;background:var(--gold);border-radius:4px}
.badge{position:absolute;top:10px;right:10px;font-weight:900;font-size:15px;padding:4px 8px;border-radius:6px}
.badge.called{background:var(--gold);color:#0A1630}
.badge.flip{right:auto;left:auto;top:10px;right:96px;background:#fff;color:#B5001F}
.card.wR{box-shadow:inset 0 -6px 0 var(--r)}.card.wD{box-shadow:inset 0 -6px 0 var(--d)}
/* ticker */
.ticker{position:absolute;left:0;bottom:0;width:1920px;height:64px;background:var(--gold);color:#0A1630;display:flex;align-items:center;overflow:hidden}
.ticker .tag{white-space:nowrap;height:100%;display:flex;align-items:center;padding:0 22px;background:#0A1630;color:var(--gold2);font-size:26px;z-index:2}
.ticker .run{white-space:nowrap;font-size:26px;font-weight:800;padding-left:30px;animation:scroll 60s linear infinite}
.ticker .run span{margin-right:60px}.ticker .run em{font-style:normal;background:#B5001F;color:#fff;padding:2px 8px;border-radius:4px;margin-right:6px;font-size:20px}
@keyframes scroll{from{transform:translateX(0)}to{transform:translateX(-50%)}}
/* banners */
.majban{position:absolute;z-index:40;left:40px;top:120px;width:1150px;padding:14px;text-align:center;font-size:40px;border-radius:14px;display:none;
background:linear-gradient(90deg,var(--gold),var(--gold2));color:#0A1630;box-shadow:0 0 40px rgba(217,190,124,.6)}
.flash{position:absolute;z-index:60;inset:0;display:none;align-items:center;justify-content:center;background:rgba(5,10,25,.72)}
.flash .box{border:4px solid var(--gold);border-radius:20px;padding:40px 70px;background:var(--navy2);text-align:center;animation:pop .5s ease}
.flash .k{font-size:44px;color:var(--gold)}.flash .m{font-size:64px;margin-top:10px}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
/* focus */
.focus{position:absolute;left:40px;top:120px;width:1180px;height:800px;border:1px solid var(--line);border-radius:16px;background:rgba(16,35,74,.85);padding:30px 40px}
.focus .st{font-size:84px;color:var(--gold2)}.focus .of{font-size:34px;opacity:.85}
.fc{display:flex;gap:24px;margin-top:30px}
.fc .c{flex:1;border-radius:14px;padding:24px;background:rgba(255,255,255,.05);position:relative}
.fc .c.R{border-top:10px solid var(--r)}.fc .c.D{border-top:10px solid var(--d)}
.fc .nm{font-size:48px}.fc .pt{font-size:96px;font-weight:900;margin-top:10px}.fc .pp{font-size:26px;opacity:.8}
.fc .c.win{outline:4px solid var(--gold)}
.frep{margin-top:30px;font-size:28px}.frep .rb{height:16px;background:var(--grey);border-radius:8px;margin-top:10px}.frep .rb i{display:block;height:100%;background:var(--gold);border-radius:8px}
.fbadge{display:inline-block;margin-left:16px;font-size:30px;padding:6px 16px;border-radius:8px;vertical-align:middle}
.mini{position:absolute;display:flex;flex-direction:column;gap:12px}
.mini .bar{height:112px}
.mini .bar .num{font-size:36px}.mini .bar .lab{font-size:24px;width:90px}.mini .bar .net{min-width:0;font-size:16px}.mini .bar .mid{font-size:15px}
.calls{position:absolute;border:1px solid var(--line);border-radius:12px;background:rgba(16,35,74,.85);padding:14px 18px;overflow:hidden}
.calls h3{color:var(--gold2);font-size:24px;margin-bottom:8px}
.calls div{font-size:20px;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.08)}
.calls div b{color:var(--gold2);margin-right:8px}
.mini.compact .sub,.mini.compact .majl{display:none}.mini.compact .bar{height:100px;padding:10px 14px}.mini.compact .bar .num{font-size:28px}.mini.compact .bar .lab{font-size:22px;width:70px}.mini.compact .track{height:34px;margin-top:10px}
#conn{position:fixed;z-index:80;right:330px;top:30px;display:none;background:rgba(10,22,48,.9);border:2px solid #F2C94C;color:#F2C94C;font-size:18px;font-weight:800;padding:5px 14px;border-radius:999px}
#conn.on{display:block}
/* waiting */
.wait{position:absolute;inset:96px 0 64px 0;display:flex;align-items:center;justify-content:center;gap:90px}
.wait img{height:520px}
.wait .tt{font-size:92px;color:var(--gold2);line-height:1.1}
.wait .cd{font-size:120px;margin-top:20px}.wait .nx{font-size:30px;opacity:.85}
.wait ul{list-style:none;margin-top:24px;font-size:24px;line-height:1.6}
/* ── 배경 이미지 + 은은한 모션 (2026-10-24). CSS transform/opacity 만 사용 → GPU 합성, 영상 파일 없음.
   기본: waiting = 펄럭이는 성조기(bg_flag), main/focus/trump = 미국 지도 스테이지(bg_map_stage).
   &bg=flag|map 으로 강제, &bg=none 이면 예전 네이비 그라데이션. &static=1 이면 배경 모션도 멈춤 ── */
#bg{position:fixed;left:0;top:0;width:1920px;height:1080px;z-index:0;overflow:hidden;background:#08122A;pointer-events:none}
#app{z-index:1}
body.hasbg #app{background:none}
#bg .bgk{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:50% 50%;will-change:transform;animation:bgpush 26s ease-in-out infinite alternate}
#bg .bgi{position:absolute;inset:-14px;background:center/cover no-repeat}
@keyframes bgpush{0%{transform:scale(1.005) translate(0,0)}100%{transform:scale(1.035) translate(-0.8%,-0.5%)}}
#bg.map .bgi{background-image:url("assets/bg/bg_map_stage.jpg")}
#bg.map .bgk{animation-name:bgpan;animation-duration:28s}
@keyframes bgpan{0%{transform:scale(1.035) translate(0.9%,0)}100%{transform:scale(1.035) translate(-0.9%,-0.4%)}}
/* 지도 스테이지: 패널 뒤는 네이비 반투명으로 눌러서 글자 가독성 확보, 가장자리 비네트 */
#bg .scrim{position:absolute;inset:0}
#bg.map .scrim{background:
 linear-gradient(90deg,rgba(8,18,42,.28) 0%,rgba(8,18,42,.18) 60%,rgba(8,18,42,0) 66%),
 linear-gradient(180deg,rgba(8,18,42,.55) 0%,rgba(8,18,42,.30) 30%,rgba(8,18,42,.42) 55%,rgba(8,18,42,.62) 100%),
 radial-gradient(1500px 900px at 50% 50%,transparent 45%,rgba(4,10,26,.55) 100%)}
/* 성조기: 세로 띠(64개)를 위상 차를 두고 위아래로 움직여 천이 물결치는 느낌 + 부드러운 음영 띠 + 느린 빛 쓸림 */
#bg.flag .bgk{animation-duration:24s}
#bg .fs{position:absolute;top:-16px;height:1112px;background-image:url("assets/bg/bg_flag.jpg");background-repeat:no-repeat;will-change:transform;
 animation:fwave 9s ease-in-out infinite;animation-delay:var(--dl)}
@keyframes fwave{0%,100%{transform:translateY(calc(var(--a)*1px))}50%{transform:translateY(calc(var(--a)*-1px))}}
#bg .shade{position:absolute;top:-40px;bottom:-40px;left:-1800px;width:5600px;mix-blend-mode:soft-light;opacity:.42;will-change:transform;
 background:none;
 -webkit-mask-image:linear-gradient(90deg,transparent 30%,#000 52%);mask-image:linear-gradient(90deg,transparent 30%,#000 52%);
 animation:fshade 9s linear infinite}
@keyframes fshade{from{transform:translateX(-914px)}to{transform:translateX(0)}}
#bg .sheen{position:absolute;top:-10%;bottom:-10%;left:0;width:1400px;mix-blend-mode:screen;opacity:.16;will-change:transform;
 background:linear-gradient(105deg,transparent 0%,rgba(255,214,150,.0) 25%,rgba(255,226,170,.55) 50%,rgba(255,214,150,0) 75%,transparent 100%);
 transform:translateX(-1500px) skewX(-12deg);animation:fsheen 16s ease-in-out infinite}
@keyframes fsheen{0%,30%{transform:translateX(-1500px) skewX(-12deg)}100%{transform:translateX(2100px) skewX(-12deg)}}
#bg.flag .scrim{background:
 radial-gradient(900px 640px at 1220px 560px,rgba(6,14,34,.80) 0%,rgba(6,14,34,.62) 45%,rgba(6,14,34,0) 100%),
 linear-gradient(90deg,rgba(6,14,34,.30) 0%,rgba(6,14,34,.15) 30%,rgba(6,14,34,.45) 70%,rgba(6,14,34,.55) 100%),
 radial-gradient(1500px 900px at 50% 50%,transparent 50%,rgba(4,10,26,.5) 100%)}
html.static #bg *{animation:none!important}
.wait .tt,.wait .nx,.wait .cd,.wait ul{text-shadow:0 2px 6px rgba(0,0,0,.75),0 0 18px rgba(4,10,26,.6)}
.wait img{filter:drop-shadow(0 8px 24px rgba(0,0,0,.55))}

/* ═══════════ v5 (2026-10-31): 화려·생동감 + 접전지 카드 순환 ═══════════
   금색 팔레트: base #EABD7D · light #FADBA3 · dark #CE9B60.  모두 transform/opacity 위주 CSS 애니메이션(+rAF 카운트업) → 가벼움.
   &static=1 이면 장식 모션 전부 끔(티커 스크롤·카드 순환은 유지) */
:root{--g1:#EABD7D;--g2:#FADBA3;--g3:#CE9B60}
.rb i,.sbar i{transition:width 1.1s cubic-bezier(.2,.8,.2,1)}
.seg{transition:width 1.1s cubic-bezier(.2,.8,.2,1)}
/* 배경: 느린 금빛 그라데이션 + 떠오르는 금가루 (패널 뒤에 깔려서 글자 가독성 영향 없음) */
#fx{position:fixed;left:0;top:0;width:1920px;height:1080px;z-index:0;pointer-events:none;overflow:hidden}
#fx .gl{position:absolute;left:-20%;top:-20%;width:140%;height:140%;will-change:transform;animation:fxdrift 42s ease-in-out infinite alternate;
 background:radial-gradient(620px 420px at 22% 32%,rgba(234,189,125,.13),transparent 70%),radial-gradient(760px 520px at 78% 68%,rgba(250,219,163,.09),transparent 70%),radial-gradient(500px 360px at 55% 12%,rgba(206,155,96,.10),transparent 70%)}
@keyframes fxdrift{from{transform:translate(-3%,-2%) scale(1)}to{transform:translate(4%,3%) scale(1.1)}}
#fx i{position:absolute;bottom:-24px;left:var(--x);width:var(--s);height:var(--s);border-radius:50%;opacity:0;will-change:transform,opacity;
 background:radial-gradient(circle,#FFF8E2 0%,rgba(250,219,163,.9) 35%,rgba(234,189,125,0) 72%);box-shadow:0 0 10px 2px rgba(255,214,130,.45);animation:fxup var(--t) linear var(--d) infinite}
@keyframes fxup{0%{transform:translate(0,0);opacity:0}8%{opacity:var(--o)}88%{opacity:var(--o)}100%{transform:translate(var(--dx),-1130px);opacity:0}}
/* LIVE 배지: 깜빡이는 점 + 퍼지는 링 */
.live{position:relative;display:flex;align-items:center;gap:8px}
.live::before{content:"";width:11px;height:11px;border-radius:50%;background:#fff;box-shadow:0 0 8px #fff;animation:ldot 1.4s ease-in-out infinite}
.live::after{content:"";position:absolute;inset:0;border-radius:6px;border:2px solid #FF4D63;pointer-events:none;animation:lring 1.8s ease-out infinite}
@keyframes ldot{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.25;transform:scale(.65)}}
@keyframes lring{0%{opacity:.95;transform:scale(1)}100%{opacity:0;transform:scale(1.28,1.7)}}
/* ═══ v5c: 쓸림(sweep)·반짝 전부 제거 → 갱신 글로우 · 숨쉬기 · 배경 광선 · 막대 끝 맥박 · Ken Burns ═══ */
header .t1.h{animation:none!important}   /* 원래 있던 제목 빛줄기도 끔 (금색 그라데이션은 유지) */
/* (1) 값이 바뀐 패널: 테두리가 밝은 금/백색으로 ~1.1초 번쩍 + 바깥 글로우 (글자 위를 덮지 않음 — box-shadow 는 패널 뒤에만 그려짐) */
.upd{animation:updg 1.15s ease-out 1!important}
@keyframes updg{0%{border-color:var(--line)}16%,42%{border-color:#FFF6DE;box-shadow:0 0 30px 5px rgba(250,219,163,.85),0 0 9px 1px rgba(255,255,255,.85),inset 0 0 26px rgba(250,219,163,.22)}100%{border-color:var(--line)}}
.cu.bump{display:inline-block;animation:bump .9s cubic-bezier(.2,1.6,.4,1)}
@keyframes bump{0%{transform:scale(1)}28%{transform:scale(1.2);text-shadow:0 0 12px rgba(255,236,190,.85),0 0 3px rgba(255,255,255,.7)}100%{transform:scale(1)}}
/* (4) 숨쉬기 + 네온 테두리: 패널 뒤(z-index:-1)에 붉은→푸른 네온 링(테두리 2px)과 바깥 후광. opacity 만 천천히 오르내림(숨쉬기) → 가볍고 글자 위를 덮지 않음 */
.bar,.card,.side,.calls,#slotroot{isolation:isolate}
.bar::before,.card::before,.side::before,.calls::before,#slotroot::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1;padding:2px;
 background:linear-gradient(90deg,#FF0A35 0%,#FF4560 30%,#FFD9A0 50%,#3D8BFF 70%,#0A5BD6 100%);
 -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);
 opacity:.62;animation:breath 6.4s ease-in-out infinite;animation-delay:var(--bd,0s)}
.bar::after,.card::after,.side::after,.calls::after,#slotroot::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1;
 box-shadow:-5px 0 16px -3px rgba(255,20,55,.62),5px 0 16px -3px rgba(20,110,255,.7),0 0 12px rgba(250,219,163,.14);opacity:.6;animation:breath 6.4s ease-in-out infinite;animation-delay:var(--bd,0s)}
@keyframes breath{0%,100%{opacity:.5}50%{opacity:1}}
.upd::before{background:linear-gradient(90deg,#FFF6DE,#FFFFFF 50%,#FFF6DE)!important;animation:rflash 1.15s ease-out 1!important}
@keyframes rflash{0%{opacity:.6}16%,42%{opacity:1}100%{opacity:.6}}
.card:nth-child(4n+1){--bd:-1.1s}.card:nth-child(4n+2){--bd:-2.9s}.card:nth-child(4n+3){--bd:-4.4s}.card:nth-child(4n){--bd:-5.7s}
.bar:nth-child(2){--bd:-2s}.bar:nth-child(3){--bd:-4s}.side{--bd:-3s}.calls{--bd:-5s}

 -webkit-mask-image:radial-gradient(circle at 50% 50%,transparent 0,transparent 8%,#000 30%,#000 52%,transparent 70%);mask-image:radial-gradient(circle at 50% 50%,transparent 0,transparent 8%,#000 30%,#000 52%,transparent 70%)}

<body><div id="bg" aria-hidden="true"></div><div id="fx" aria-hidden="true"></div><div id="app"><div id="wmk" aria-hidden="true"><span>공부의여신 개표방송</span></div><div id="dyn"></div><div id="slotroot"><div class="sl-in"></div></div><div id="winroot" class="side"><div class="wn-in"></div></div></div><div id="conn">연결 재시도 중…</div>
<script>
// ?view=main|focus|trump|waiting  &race=OH-SEN  &interval=3
// v5 옵션: &slot=video (영상 자리를 예전 빈 자리로) | &slot=none (완전 투명 빈 자리) | (기본) 접전지 카드 순환   &slotsec=9 카드당 초(4~60)   &static=1 장식 모션 끔
const Q=new URLSearchParams(location.search);const STATIC=Q.has("static");if(STATIC)document.documentElement.classList.add("static");
const VIEW=Q.get("view")||"main", INTERVAL=(+Q.get("interval")||3)*1000;
const P={R:"공화",D:"민주",I:"무소속"}, OF={SEN:"상원",GOV:"주지사"};
// ═══ v5: 숫자 카운트업 · 막대 채우기 · 변경 글로우 ═══
const esc=x=>String(x==null?"":x).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const PREV={};   // key → 마지막으로 보여준 값 (render()가 DOM 을 통째로 다시 만들어도 '이전 값 → 새 값'으로 움직이게 함)
function cu(k,v,dec,suf){dec=dec||0;suf=suf||"";return `<span class="cu" data-k="${k}" data-v="${v}" data-dec="${dec}" data-suf="${suf}">${(+v).toFixed(dec)+suf}</span>`}
function glow(e){const c=e.closest(".bar,.card,.sc,.fc .c,.frep");if(c)c.classList.add("upd")}
let TW=[],twRaf=0;
function twStep(t){const keep=[];for(const w of TW){const k=Math.min(1,(t-w.t0)/w.dur),v=w.from+(w.to-w.from)*(1-Math.pow(1-k,3));
    w.e.textContent=v.toFixed(w.dec)+w.suf;if(k<1)keep.push(w);else w.e.textContent=w.to.toFixed(w.dec)+w.suf}
  TW=keep;twRaf=TW.length?requestAnimationFrame(twStep):0}
function fx(root){
  const cus=[...root.querySelectorAll(".cu")], fws=[...root.querySelectorAll("[data-w]")];
  if(STATIC){cus.forEach(e=>PREV[e.dataset.k]=+e.dataset.v);fws.forEach(e=>PREV[e.dataset.k]=+e.dataset.w);return}
  const t0=performance.now();
  for(const e of cus){const k=e.dataset.k,to=+e.dataset.v,had=PREV[k]!==undefined,from=had?PREV[k]:0;PREV[k]=to;if(from===to)continue;
    const dec=+e.dataset.dec,suf=e.dataset.suf;e.textContent=from.toFixed(dec)+suf;TW.push({e,from,to,dec,suf,t0,dur:had?900:1400});
    if(had){e.classList.add("bump");glow(e)}}
  const mv=[];
  for(const e of fws){const k=e.dataset.k,to=+e.dataset.w,had=PREV[k]!==undefined,from=had?PREV[k]:0;PREV[k]=to;if(from===to)continue;mv.push([e,from,to,had])}
  for(const [e,from] of mv){e.style.transition="none";e.style.width=from+"%"}
  if(mv.length)void document.body.offsetWidth;
  for(const [e,from,to,had] of mv){e.style.transition="";e.style.width=to+"%";if(had){glow(e);if(to>from&&!e.classList.contains("u"))bflash(e)}}
  if(TW.length&&!twRaf)twRaf=requestAnimationFrame(twStep)}

// 배경: waiting = 성조기(물결), 그 외 = 지도 스테이지.  &bg=flag|map|none 으로 바꿀 수 있음
(function(){const want=Q.get("bg")||(VIEW==="waiting"?"flag":"map"), bg=document.getElementById("bg");
  if(want==="none"){bg.style.display="none";return}
  document.body.classList.add("hasbg");
  if(want==="flag"){bg.className="flag";const N=64,W=1112*16/9,off=(W-1920)/2;let s="";
    for(let i=0;i<N;i++){const x0=Math.round(i*1920/N),x1=Math.round((i+1)*1920/N),c=(i+.5)/N,
      ramp=Math.min(1,Math.max(0,(c-.04)/.5)),a=(2+5*ramp*ramp).toFixed(2),dl=(-((((1-c*1.15)%1)+1)%1)*9).toFixed(2);
      s+=`<i class="fs" style="left:${x0}px;width:${x1-x0+1}px;background-size:${W.toFixed(0)}px 1112px;background-position:${-(x0+off).toFixed(0)}px 0;--a:${a};--dl:${dl}s"></i>`}
    bg.innerHTML=`<div class="bgk">${s}<div class="shade"></div><div class="sheen"></div></div><div class="scrim"></div>`}
  else{bg.className="map";bg.innerHTML=`<div class="bgk"><div class="bgi"></div></div><div class="scrim"></div>`}})();

const ICONS_JS={"SEN": "<svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M11 1.5h2V4h-2z\"/><path d=\"M4.5 12.5a7.5 7.5 0 0 1 15 0z\"/><path d=\"M3 13.6h18v1.8H3z\"/><path d=\"M5 16.4h2.2V20H5zM9 16.4h2.2V20H9zM12.8 16.4H15V20h-2.2zM16.8 16.4H19V20h-2.2z\"/><path d=\"M2 20.7h20v1.8H2z\"/></svg>", "HOUSE": "<svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M12 2.5 1.5 11.3h3V21h5.4v-6.2h4.2V21h5.4v-9.7h3z\"/></svg>", "GOV": "<svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M12 1.8l3 6.8 7.4.7-5.6 4.9 1.7 7.2L12 17.5 5.5 21.4l1.7-7.2L1.6 9.3l7.4-.7z\"/></svg>"};
const WN={i:0,list:[],seen:null,timer:0,cur:"",shown:false};
const WN_CH={SEN:["상원","c-sen"],HOUSE:["하원","c-house"],GOV:["주지사","c-gov"]};
function wnList(d){return [...(d.races||[]),...(d.house_races||[])].filter(r=>r&&r.winner).sort((a,b)=>(b.time_kst||"").localeCompare(a.time_kst||""))}
function wnItem(r){const w=r.winner,n=(r.cands||{})[w]||(P[w]||"")+" 후보",ch=WN_CH[r.office]||["",""],flip=r.incumbent_party&&w!==r.incumbent_party,
  ph=r.office==="SEN"&&SPHOTO[r.id]&&SPHOTO[r.id][w],okp=ph&&ph[1]===n,
  st=(r.state_ko||r.state||"")+(r.office==="HOUSE"&&r.district?" "+(+r.district||r.district)+"선거구":"")+(r.office==="SEN"&&r.special?" (특별)":"")+(r.called_by?" · "+r.called_by+" 콜":"");
  return `<div class="wn-it ${ch[1]}"><span class="wbg">당선 확정</span><span class="wp ${w}">${P[w]||w}</span>${okp?`<img class="wph" src="assets/cands/${ph[0]}.webp" alt="" onerror="this.remove()">`:""}<div class="wtx"><div class="wnm">${esc(n)}</div><div class="wst">${esc(st)}</div></div><span class="wct">${ch[0]}</span>${flip?`<span class="wfl">FLIP</span>`:""}</div>`}
function wnShow(html,key,acc){const root=$("winroot"),inner=root.firstElementChild,old=inner.firstElementChild;
  if(WN.cur===key&&old)return;WN.cur=key;
  [...inner.children].forEach(o=>{if(o.classList.contains("lv"))return;o.classList.add("lv");setTimeout(()=>o.remove(),STATIC?0:440)});   // 11/4: 겹침 수정 — 남아있는 이전 항목 전부 퇴장
  const t=document.createElement("div");t.innerHTML=html;const el=t.firstElementChild;inner.appendChild(el);
  if(acc)root.style.setProperty("--ca",acc);else root.style.removeProperty("--ca")}
function wnDraw(){const l=WN.list;if(!l.length){wnShow('<div class="wn-it wait">당선 확정 대기 중</div>',"wait");return}
  if(WN.i>=l.length)WN.i=0;const r=l[WN.i],acc=({SEN:"#EABD7D",HOUSE:"#E6EEF9",GOV:"#1FD8C0"})[r.office];wnShow(wnItem(r),r.id+r.winner+WN.i,acc)}
function wnSync(){const root=$("winroot");if(!root)return;if(VIEW!=="main"||!DATA){root.style.display="none";return}
  root.style.display="flex";WN.list=wnList(DATA);
  const ks=WN.list.map(r=>r.id+r.winner);
  if(WN.seen===null){WN.seen=new Set(ks);WN.i=0}
  else{const fresh=ks.findIndex(k=>!WN.seen.has(k));ks.forEach(k=>WN.seen.add(k));if(fresh>=0){WN.i=fresh;WN.cur=""}}
  wnDraw();
  if(!WN.timer)WN.timer=setInterval(()=>{if(WN.list.length>1){WN.i=(WN.i+1)%WN.list.length}wnDraw()},4000)}
{const __r=render;render=function(){__r.apply(this,arguments);wnSync()}}
